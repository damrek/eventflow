# CI is the phase-8 gate: every PR runs the same checks a reviewer would run by hand.
#
# The backend job runs the complete Gradle build, Testcontainers included: the integration suite
# starts PostgreSQL, RabbitMQ and Redis on the runner's own Docker and no test is skipped or
# replaced by a mock (ADR 0003). Load tests (k6) are deliberately absent: they need a running
# stack and a quiet machine, so they live in docs/performance and run on demand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — format, lint, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the committed lockfile
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Type-check and production build
        run: npm run build

  backend:
    name: Backend — build and Testcontainers suite
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Gradle build (unit + integration, real PostgreSQL, RabbitMQ and Redis)
        run: ./gradlew build --stacktrace
      - name: Upload the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: Image — ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, booking, notification, payment, payment-simulator]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: eventflow/${{ matrix.service }}:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-image:
    name: Image — frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          target: runtime-proxy
          tags: eventflow/frontend:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
