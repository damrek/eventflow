spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USER:eventflow}
    password: ${PAYMENT_DB_PASSWORD:eventflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eventflow}
    password: ${RABBITMQ_PASSWORD:eventflow}
    # The outbox relay marks a row published only after waitForConfirmsOrDie succeeds.
    publisher-confirm-type: correlated
    listener:
      simple:
        # The listener transaction commits before the container acks; a crash in between
        # redelivers the message and the inbox makes the second delivery a no-op.
        acknowledge-mode: auto
        prefetch: 20
        default-requeue-rejected: false
        retry:
          # One handler attempt per delivery: the recoverer moves the message to its retry queue,
          # so the backoff is queue-based, survives a restart and never blocks a consumer thread.
          enabled: true
          max-retries: 0
          stateless: true
  http:
    clients:
      # The provider simulator answers ".99" amounts after 5s, which is longer than this read
      # timeout, so the timeout path is real and not simulated in the client.
      connect-timeout: ${PAYMENT_PROVIDER_CONNECT_TIMEOUT:2s}
      read-timeout: ${PAYMENT_PROVIDER_READ_TIMEOUT:2s}

server:
  port: ${PAYMENT_PORT:8084}

payment:
  provider:
    url: ${PAYMENT_PROVIDER_URL:http://localhost:8085/simulator/authorizations}
    circuit-breaker:
      sliding-window-size: ${PAYMENT_CB_WINDOW:10}
      minimum-number-of-calls: ${PAYMENT_CB_MIN_CALLS:5}
      failure-rate-threshold: ${PAYMENT_CB_FAILURE_RATE:50}
      wait-duration-in-open-state: ${PAYMENT_CB_OPEN_WAIT:PT10S}
      permitted-calls-in-half-open-state: ${PAYMENT_CB_HALF_OPEN_CALLS:3}

eventflow:
  messaging:
    exchange: ${EVENTFLOW_EXCHANGE:eventflow.events}
    dead-letter-exchange: ${EVENTFLOW_DLX:eventflow.events.dlx}
    outbox:
      interval: ${EVENTFLOW_OUTBOX_INTERVAL:PT1S}
      batch-size: ${EVENTFLOW_OUTBOX_BATCH_SIZE:50}
      confirm-timeout: PT5S
    retry:
      # One retry queue per entry, in order; the last failure goes to the DLQ.
      delays: ${EVENTFLOW_RETRY_DELAYS:5s,15s,45s}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-none}]"
