spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${BOOKING_DB_USER:eventflow}
    password: ${BOOKING_DB_PASSWORD:eventflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eventflow}
    password: ${RABBITMQ_PASSWORD:eventflow}
    # The outbox relay marks a row published only after waitForConfirmsOrDie succeeds.
    publisher-confirm-type: correlated
    listener:
      simple:
        # The listener transaction commits before the container acks; a crash in between
        # redelivers the message and the inbox makes the second delivery a no-op.
        acknowledge-mode: auto
        prefetch: 20
        default-requeue-rejected: false
        retry:
          # One handler attempt per delivery: the recoverer moves the message to its retry queue,
          # so the backoff is queue-based, survives a restart and never blocks a consumer thread.
          enabled: true
          max-retries: 0
          stateless: true

server:
  port: ${BOOKING_PORT:8082}

eventflow:
  messaging:
    exchange: ${EVENTFLOW_EXCHANGE:eventflow.events}
    dead-letter-exchange: ${EVENTFLOW_DLX:eventflow.events.dlx}
    outbox:
      interval: ${EVENTFLOW_OUTBOX_INTERVAL:PT1S}
      batch-size: ${EVENTFLOW_OUTBOX_BATCH_SIZE:50}
      confirm-timeout: PT5S
    retry:
      # One retry queue per entry, in order; the last failure goes to the DLQ.
      delays: ${EVENTFLOW_RETRY_DELAYS:5s,15s,45s}

booking:
  reservation:
    # How long a HELD reservation keeps its units before the expiry worker releases them.
    ttl: ${BOOKING_RESERVATION_TTL:PT10M}
  expiry:
    interval: ${BOOKING_EXPIRY_INTERVAL:PT5S}
    batch-size: ${BOOKING_EXPIRY_BATCH_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-none}]"
