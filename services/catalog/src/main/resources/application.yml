spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${CATALOG_DB_USER:eventflow}
    password: ${CATALOG_DB_PASSWORD:eventflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eventflow}
    password: ${RABBITMQ_PASSWORD:eventflow}
    # The outbox relay marks a row published only after waitForConfirmsOrDie succeeds.
    publisher-confirm-type: correlated
    template:
      # Sends a traceparent header so the consumer continues this trace (S3).
      observation-enabled: true

server:
  port: ${CATALOG_PORT:8081}

eventflow:
  messaging:
    exchange: ${EVENTFLOW_EXCHANGE:eventflow.events}
    outbox:
      interval: ${EVENTFLOW_OUTBOX_INTERVAL:PT1S}
      batch-size: ${EVENTFLOW_OUTBOX_BATCH_SIZE:50}
      confirm-timeout: PT5S

management:
  # Tracing (S3). Export is opt-in: the collector only exists in the observability profile, so a
  # local bootRun or a test run creates and propagates spans without posting them anywhere.
  tracing:
    export:
      otlp:
        enabled: ${OTEL_TRACES_ENABLED:false}
    # Every span is sampled locally; a production deployment would lower this and say so.
    sampling:
      probability: ${OTEL_TRACES_SAMPLING:1.0}
    propagation:
      type: W3C
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        # prometheus is scraped by Prometheus on the internal Compose network; it is never
        # published through the front door.
        include: health,info,prometheus
  endpoint:
    health:
      # Boot 4.2 enables the liveness and readiness groups by default. Readiness is widened with the
      # database because a replica that cannot read its schema must not take traffic; the broker is
      # deliberately excluded, so a broker restart never drains every replica.
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-none}]"
