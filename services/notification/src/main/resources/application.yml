spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USER:eventflow}
    password: ${NOTIFICATION_DB_PASSWORD:eventflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eventflow}
    password: ${RABBITMQ_PASSWORD:eventflow}
    listener:
      simple:
        # Reads the traceparent header the producer wrote, so the broker hop joins one trace.
        observation-enabled: true
        # The listener transaction commits before the container acks; a crash in between
        # redelivers the message and the inbox makes the second delivery a no-op.
        acknowledge-mode: auto
        prefetch: 20
        default-requeue-rejected: false
        retry:
          # One handler attempt per delivery: the recoverer moves the message to its retry queue,
          # so the backoff is queue-based, survives a restart and never blocks a consumer thread.
          enabled: true
          max-retries: 0
          stateless: true

server:
  port: ${NOTIFICATION_PORT:8083}

eventflow:
  messaging:
    exchange: ${EVENTFLOW_EXCHANGE:eventflow.events}
    dead-letter-exchange: ${EVENTFLOW_DLX:eventflow.events.dlx}
    retry:
      # One retry queue per entry, in order; the last failure goes to the DLQ.
      delays: ${EVENTFLOW_RETRY_DELAYS:5s,15s,45s}

management:
  metrics:
    distribution:
      # HTTP latency percentiles need histogram buckets: without them the dashboards could only
      # show an average, and the documented latency panels would have nothing to quantile.
      percentiles-histogram:
        http.server.requests: true
  # Tracing (S3). Export is opt-in: the collector only exists in the observability profile, so a
  # local bootRun or a test run creates and propagates spans without posting them anywhere.
  tracing:
    export:
      otlp:
        enabled: ${OTEL_TRACES_ENABLED:false}
    # Every span is sampled locally; a production deployment would lower this and say so.
    sampling:
      probability: ${OTEL_TRACES_SAMPLING:1.0}
    propagation:
      type: W3C
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        # prometheus is scraped by Prometheus on the internal Compose network; it is never
        # published through the front door.
        include: health,info,prometheus
  endpoint:
    health:
      # Boot 4.2 enables the liveness and readiness groups by default. Readiness is widened with the
      # database because a replica that cannot read its schema must not take traffic; the broker is
      # deliberately excluded, so a broker restart never drains every replica.
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      # One JSON object per line (ECS) on stdout: service.name, trace.id, span.id and the MDC
      # (requestId, and reservationId/eventId while a consumer handles an event).
      console: ${EVENTFLOW_LOG_FORMAT:ecs}
