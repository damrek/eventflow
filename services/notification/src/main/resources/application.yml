spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USER:eventflow}
    password: ${NOTIFICATION_DB_PASSWORD:eventflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eventflow}
    password: ${RABBITMQ_PASSWORD:eventflow}
    listener:
      simple:
        # The listener transaction commits before the container acks; a crash in between
        # redelivers the message and the inbox makes the second delivery a no-op.
        acknowledge-mode: auto
        prefetch: 20
        default-requeue-rejected: false

server:
  port: ${NOTIFICATION_PORT:8083}

eventflow:
  messaging:
    exchange: ${EVENTFLOW_EXCHANGE:eventflow.events}
    dead-letter-exchange: ${EVENTFLOW_DLX:eventflow.events.dlx}
    retry:
      # One retry queue per entry, in order; the last failure goes to the DLQ.
      delays: ${EVENTFLOW_RETRY_DELAYS:5s,15s,45s}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-none}]"
