name: eventflow

# The services post traces only when a collector exists. `scripts/observability-up.sh` starts the
# observability profile with OTEL_TRACES_ENABLED=true; `stack-up.sh` leaves it false, so a stack
# without a collector creates spans and propagates them without posting them anywhere.
x-tracing: &tracing
  OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
  OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}

services:
  postgres:
    image: postgres:18-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventflow}
      POSTGRES_DB: ${CATALOG_DB:-catalog_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep the cluster in /var/lib/postgresql/<major>/docker,
      # so the volume must be mounted at /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      # One instance, one database per service: the script creates booking_db and
      # notification_db on a fresh volume; an existing volume needs `docker compose down -v`.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["core"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eventflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eventflow}
    ports:
      # AMQP for the services, management UI at http://localhost:15672.
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    profiles: ["core"]
    # Ephemeral on purpose: the waiting room, admission tokens and rate-limit counters may be
    # lost on a restart. PostgreSQL stays the authority on stock (ADR 0011).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # Profile "app": the built images. Every service reads its port and datasource from the
  # environment, so only the URLs change with respect to `bootRun` on the host.
  #
  # The "core" profile still owns PostgreSQL, RabbitMQ and Redis, so both profiles start together:
  #   docker compose --profile core --profile app up -d --build
  #
  # Only the front door publishes a port; the five services stay on the Compose network, which is
  # what makes the SPA's single-origin contract (/api/catalog, /api/booking, /api/notification) true
  # in the container stack and not only under `npm run dev`.
  # ---------------------------------------------------------------------------------------------
  catalog:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: runtime
      args:
        SERVICE: catalog
    image: eventflow/catalog:${EVENTFLOW_TAG:-local}
    environment:
      <<: *tracing
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/${CATALOG_DB:-catalog_db}
      CATALOG_DB_USER: ${POSTGRES_USER:-eventflow}
      CATALOG_DB_PASSWORD: ${POSTGRES_PASSWORD:-eventflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-eventflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eventflow}
      EVENTFLOW_EXCHANGE: ${EVENTFLOW_EXCHANGE:-eventflow.events}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  booking:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: runtime
      args:
        SERVICE: booking
    image: eventflow/booking:${EVENTFLOW_TAG:-local}
    environment:
      <<: *tracing
      BOOKING_DB_URL: jdbc:postgresql://postgres:5432/${BOOKING_DB:-booking_db}
      BOOKING_DB_USER: ${POSTGRES_USER:-eventflow}
      BOOKING_DB_PASSWORD: ${POSTGRES_PASSWORD:-eventflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-eventflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eventflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  notification:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: runtime
      args:
        SERVICE: notification
    image: eventflow/notification:${EVENTFLOW_TAG:-local}
    environment:
      <<: *tracing
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/${NOTIFICATION_DB:-notification_db}
      NOTIFICATION_DB_USER: ${POSTGRES_USER:-eventflow}
      NOTIFICATION_DB_PASSWORD: ${POSTGRES_PASSWORD:-eventflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-eventflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eventflow}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  payment:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: runtime
      args:
        SERVICE: payment
    image: eventflow/payment:${EVENTFLOW_TAG:-local}
    environment:
      <<: *tracing
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/${PAYMENT_DB:-payment_db}
      PAYMENT_DB_USER: ${POSTGRES_USER:-eventflow}
      PAYMENT_DB_PASSWORD: ${POSTGRES_PASSWORD:-eventflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-eventflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eventflow}
      # Inside the network the provider is the simulator service, never localhost.
      PAYMENT_PROVIDER_URL: http://payment-simulator:8085/simulator/authorizations
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  payment-simulator:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: runtime
      args:
        SERVICE: payment-simulator
    image: eventflow/payment-simulator:${EVENTFLOW_TAG:-local}
    environment:
      <<: *tracing
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime-proxy
    image: eventflow/frontend:${EVENTFLOW_TAG:-local}
    environment:
      # The nginx entrypoint renders these into the proxy configuration. The defaults in the image
      # already match the service names below, and they are repeated here as documentation.
      CATALOG_UPSTREAM: catalog:8081
      BOOKING_UPSTREAM: booking:8082
      NOTIFICATION_UPSTREAM: notification:8083
    ports:
      # Loopback only, like every other published port: the SPA and /api/* share this one origin,
      # and the API has no authentication, so binding it to 0.0.0.0 would hand any peer on the
      # network read access to every user's mailbox.
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      catalog:
        condition: service_healthy
      booking:
        condition: service_healthy
      notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Profile "observability": Prometheus, Grafana, an OpenTelemetry collector and Tempo.
  #
  #   ./scripts/observability-up.sh      # core + app + observability, tracing on
  #   ./scripts/observability-down.sh    # stop it (--volumes also deletes data)
  #
  # Prometheus scrapes the five services and RabbitMQ (which serves its own /metrics on 15692);
  # the services post OTLP/HTTP to the collector; the collector batches into Tempo; Grafana reads
  # both. Only Grafana and Prometheus publish a port, both on 127.0.0.1.
  # -------------------------------------------------------------------------------------------
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A local stack keeps a few hours, not a few weeks.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-6h}
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.6
    environment:
      # Local stack: anonymous viewing, no login wall, no secrets in the repository.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/observability/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  tempo-data:
