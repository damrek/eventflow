# k3d front door: only the SPA. The Ingress routes /api/catalog, /api/booking and
# /api/notification to their services and strips the prefix with a Traefik middleware, so this
# container has no upstream hostname to resolve when it starts.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
