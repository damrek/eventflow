# OpenTelemetry Collector for the EventFlow Compose stack (profile "observability").
#
# The services post OTLP/HTTP to this collector; the collector batches and forwards to Tempo. Tempo
# is not exposed outside the Compose network, so the only thing a developer points at is the
# collector endpoint every service already reads from OTEL_TRACES_ENDPOINT.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      # In-network traffic inside one Compose network; TLS is out of scope for the local stack.
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
