# Booking runs two replicas on purpose: the concurrent hold uses conditional SQL and the waiting
# room/outbox/expiry claims use SKIP LOCKED and atomic Lua, so both replicas serve at the same time
# without overselling and without admitting anyone twice. scripts/k3d-verify.sh proves exactly that.
apiVersion: v1
kind: Service
metadata:
  name: booking
  labels:
    app: booking
spec:
  selector:
    app: booking
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: booking
    spec:
      # Kubernetes service links would inject <SERVICE>_PORT=tcp://host:port for every
      # Service in the namespace, which collides with the *_PORT variables these images read.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: booking
          image: eventflow/booking:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: eventflow-config
          env:
            - name: BOOKING_DB_USER
              valueFrom:
                secretKeyRef:
                  name: eventflow-secrets
                  key: POSTGRES_USER
            - name: BOOKING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventflow-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
      # A graceful stop lets an in-flight reservation transaction and the listener ack finish.
      terminationGracePeriodSeconds: 30
