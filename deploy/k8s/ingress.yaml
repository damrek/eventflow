# One entry point for the whole system. There is no `host:` rule on purpose, so the demo answers on
# http://localhost:8090 (the port scripts/k3d-up.sh maps from the load balancer) and on
# http://eventflow.localhost, without editing /etc/hosts.
#
# Traefik resolves the longest matching path, so /api/* reaches a service and everything else
# reaches the SPA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: eventflow-strip-catalog@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  number: 8081
---
